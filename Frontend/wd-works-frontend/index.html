<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WD Works</title>
    <script>
      (function () {
        try {
          var chave = "wd-works-theme";
          var tema = localStorage.getItem(chave);
          if (tema !== "light" && tema !== "dark") {
            tema = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", tema);
        } catch (e) {}
      })();
    </script>
    <script>
    (function () {
        try {
            var guardado = localStorage.getItem("wd-works-theme");
            var prefereEscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
            var tema = guardado === "light" || guardado === "dark"
                ? guardado
                : (prefereEscuro ? "dark" : "light");

            document.documentElement.setAttribute("data-theme", tema);
        } catch (e) {
            document.documentElement.setAttribute("data-theme", "light");
        }
    })();
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
