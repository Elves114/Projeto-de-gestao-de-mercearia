# ============================================================
# WD WORKS V2 — PERFIL DE DESENVOLVIMENTO
# ============================================================
# Ativar com:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# ============================================================

# ------------------------------------------------------------
# JWT — chave fixa para dev
# ------------------------------------------------------------
security.jwt.secret=dev-secret-com-pelo-menos-32-caracteres-12345678
security.jwt.expiration=86400000

# ------------------------------------------------------------
# RATE LIMIT — desativado em dev (seeds, stress tests)
# ------------------------------------------------------------
security.rate-limit.capacidade=1000000
security.rate-limit.tokens-por-periodo=1000000
security.rate-limit.periodo-segundos=1

# ------------------------------------------------------------
# CORS — permissivo em dev
# ------------------------------------------------------------
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

# ------------------------------------------------------------
# FRONTEND
# ------------------------------------------------------------
app.frontend.url=http://localhost:5173

# ------------------------------------------------------------
# LOGGING — verboso em dev
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.WD.works.V2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.security=INFO

# ------------------------------------------------------------
# SQL — mostrar no console
# ------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# ACTUATOR — todos os endpoints em dev
# ------------------------------------------------------------
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ------------------------------------------------------------
# AUDITORIA — limite maior em dev
# ------------------------------------------------------------
auditoria.limite-caracteres=20000

# Mostrar stack traces em dev
server.error.include-stacktrace=always
server.error.include-message=always

# application-dev.properties
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false