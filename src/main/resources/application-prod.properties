# ============================================================
# WD WORKS V2 — PERFIL DE PRODUÇÃO
# ============================================================
# Ativar com:
#   export JWT_SECRET="..."
#   export DB_URL="..."
#   export DB_USERNAME="..."
#   export DB_PASSWORD="..."
#   export CORS_ORIGINS="..."
#   java -jar app.jar --spring.profiles.active=prod
# ============================================================

# ------------------------------------------------------------
# SERVIDOR
# ------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# HTTPS — descomentar após configurar SSL (ou usar Nginx como reverse proxy)
# server.ssl.enabled=true
# server.ssl.certificate=/etc/letsencrypt/live/app.wdworks.co.mz/fullchain.pem
# server.ssl.certificate-private-key=/etc/letsencrypt/live/app.wdworks.co.mz/privkey.pem
# server.port=8443

# ------------------------------------------------------------
# BASE DE DADOS
# ------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool Hikari otimizado para produção
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------
# Flyway gere o schema. Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# ------------------------------------------------------------
# FLYWAY
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=initial schema
logging.level.org.flywaydb=WARN

# ------------------------------------------------------------
# PAGINAÇÃO
# ------------------------------------------------------------
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ------------------------------------------------------------
# JWT
# ------------------------------------------------------------
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=900000

# ------------------------------------------------------------
# RATE LIMIT — restritivo em produção
# ------------------------------------------------------------
security.rate-limit.capacidade=30
security.rate-limit.tokens-por-periodo=5
security.rate-limit.periodo-segundos=6

# ------------------------------------------------------------
# CORS — só o domínio de produção
# ------------------------------------------------------------
cors.allowed-origins=${CORS_ORIGINS}

# ------------------------------------------------------------
# FRONTEND
# ------------------------------------------------------------
app.frontend.url=${FRONTEND_URL}

# ------------------------------------------------------------
# EMAIL (Brevo)
# ------------------------------------------------------------
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Desativa o health check do email
management.health.mail.enabled=false
mail.enabled=false

# ------------------------------------------------------------
# SWAGGER — desligado em produção
# ------------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ------------------------------------------------------------
# ACTUATOR — mínimo
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# ------------------------------------------------------------
# LOGGING — mínimo
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.WD.works.V2=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.cache=INFO

# ------------------------------------------------------------
# AUDITORIA
# ------------------------------------------------------------
auditoria.limite-caracteres=8000