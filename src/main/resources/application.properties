# ============================================================
# WD WORKS V2 — CONFIGURAÇÃO BASE (comum a todos os ambientes)
# ============================================================
# Este ficheiro contém apenas valores comuns.
# Configurações específicas de ambiente ficam em:
#   - application-dev.properties
#   - application-prod.properties
#   - application-test.properties
# ============================================================

# ------------------------------------------------------------
# APLICAÇÃO
# ------------------------------------------------------------
spring.application.name=WD-Works-V2

# ------------------------------------------------------------
# BASE DE DADOS (default = dev local)
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wdworks}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:danmachi}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------
# Flyway gere o schema. Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# FLYWAY — gestor de schema
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=initial schema

# ------------------------------------------------------------
# CACHE (Caffeine — in-memory)
# ------------------------------------------------------------
spring.cache.type=caffeine
spring.cache.cache-names=dashboard,produtos,categorias,estoques
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30s

# ------------------------------------------------------------
# PAGINAÇÃO
# ------------------------------------------------------------
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ------------------------------------------------------------
# JWT (default = prod-safe; dev sobrepõe)
# ------------------------------------------------------------
security.jwt.secret=${JWT_SECRET}
# Access token expira em 15 minutos (900000 ms)
security.jwt.expiration=${JWT_EXPIRATION:900000}

# Refresh token expira em 7 dias
security.refresh-token.expiracao-dias=7

# ------------------------------------------------------------
# RATE LIMIT (default = prod; dev sobrepõe)
# ------------------------------------------------------------
security.rate-limit.capacidade=30
security.rate-limit.tokens-por-periodo=5
security.rate-limit.periodo-segundos=6

# ------------------------------------------------------------
# CORS (default = dev; prod sobrepõe)
# ------------------------------------------------------------
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------
# FRONTEND (usado em links de recuperação de senha)
# ------------------------------------------------------------
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ------------------------------------------------------------
# AUDITORIA
# ------------------------------------------------------------
auditoria.limite-caracteres=8000

