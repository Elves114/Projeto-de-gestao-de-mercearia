# ============================================================
# TESTES — H2 em memória
# ============================================================

# Base de dados em memória (Modo PostgreSQL para suportar o CAST AS LocalDate)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Correção: Chave correta para o Spring Boot 3+
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Desativa o Flyway nos testes (as migrações são para PostgreSQL)
spring.flyway.enabled=false

# Rate limit
security.rate-limit.capacidade=1000000
security.rate-limit.tokens-por-periodo=1000000
security.rate-limit.periodo-segundos=1

# JWT
security.jwt.secret=chave-de-teste-com-pelo-menos-32-caracteres-1234567890
security.jwt.expiration=3600000

# CORS e Frontend
cors.allowed-origins=http://localhost:5173
app.frontend.url=http://localhost:5173

# Desativa mail
mail.enabled=false