spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Rate limit sem efeito em testes
security.rate-limit.capacidade=1000000
security.rate-limit.tokens-por-periodo=1000000
security.rate-limit.periodo-segundos=1

# JWT
security.jwt.secret=chave-de-teste-com-pelo-menos-32-caracteres-1234567890
security.jwt.expiration=3600000

# CORS
cors.allowed-origins=http://localhost:5173

# Frontend
app.frontend.url=http://localhost:5173

# Desativa mail
mail.enabled=false